<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Pertama</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 50px;
        }
        h1 {
            color: #007BFF;
        }
        p {
            color: #555;
        }
        button {
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Halo, Dunia!</h1>
    <p>Ini adalah contoh halaman HTML sederhana.</p>

    <button onclick="tampilkanPesan()">
        Klik Saya
    </button>

    <script>
        function tampilkanPesan() {
            alert("Halo! Tombol berhasil diklik.");
        }
    </script>

</body>
</html>
